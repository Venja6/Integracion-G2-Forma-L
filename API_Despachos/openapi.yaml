openapi: 3.0.3
info:
  title: API de Sistema de Despachos - CargaSur
  description: API REST para la gestión de clientes y órdenes de despacho logístico.
  version: 1.0.0

servers:
  - url: /v1
    description: Servidor principal (versión 1)

security:
  - BearerAuth: []

paths:
  /auth/token:
    post:
      summary: Obtener un token de acceso
      description: >
        Recibe usuario y contraseña y devuelve un JWT firmado que expira.
        El token incluye el rol del usuario (operador o consulta).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /clientes:
    get:
      summary: Listar clientes
      description: Retorna una lista de todos los clientes registrados.
      responses:
        '200':
          description: Lista de clientes obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
          
    post:
      summary: Crear un cliente
      description: Registra un nuevo cliente en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '201':
          description: Cliente creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Ya existe un cliente con ese email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /clientes/{id}:
    get:
      summary: Consultar un cliente específico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del cliente
      responses:
        '200':
          description: Datos del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /despachos:
    get:
      summary: Listar despachos
      description: Retorna una lista de todas las órdenes de despacho registradas.
      responses:
        '200':
          description: Lista de despachos obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Despacho'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      summary: Registrar una orden de despacho
      description: >
        Crea un nuevo despacho. Esta operación reserva internamente en el sistema de Flota
        (vía gRPC) la capacidad del camión en la ruta origen → destino. Si no hay capacidad
        suficiente responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespachoInput'
      responses:
        '201':
          description: Despacho registrado exitosamente (camión con capacidad).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflicto. No hay capacidad de carga disponible en el camión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: >
            Servicio no disponible. El sistema interno de Flota no responde o está caído.
            (Manejo de falla de dependencia).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /despachos/{id}:
    get:
      summary: Consultar un despacho específico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único de la orden de despacho
      responses:
        '200':
          description: Detalles del despacho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Revertir una operación de despacho
      description: >
        Cancela una orden de despacho existente. Internamente notificará a Flota
        para liberar la capacidad de carga del camión.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la orden de despacho a revertir
      responses:
        '204':
          description: >
            Despacho revertido exitosamente (estado CANCELADO) y capacidad liberada en Flota.
            Es idempotente: revertir un despacho ya cancelado también retorna 204.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Flota rechazó la liberación de capacidad por inconsistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: El sistema interno de Flota no responde o está caído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /camiones/disponibles:
    get:
      summary: Buscar camiones con capacidad en una ruta
      description: >
        Consulta a Flota (vía gRPC) los camiones que operan la ruta origen → destino
        y tienen al menos carga_kg de capacidad libre. Ordenados de mayor a menor capacidad.
      parameters:
        - in: query
          name: origen
          required: true
          schema:
            type: string
            minLength: 1
          example: Concepcion
        - in: query
          name: destino
          required: true
          schema:
            type: string
            minLength: 1
          example: Chillan
        - in: query
          name: carga_kg
          required: false
          schema:
            type: number
            minimum: 0
            default: 0
          description: Capacidad libre mínima requerida, en kg.
      responses:
        '200':
          description: Camiones disponibles (lista vacía si ninguno cumple).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CamionDisponible'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: El sistema interno de Flota no responde o está caído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token obtenido en POST /v1/auth/token. Rol operador puede leer y modificar;
        rol consulta solo puede leer.

  schemas:
    Cliente:
      type: object
      properties:
        id:
          type: string
          example: "C-1001"
        nombre:
          type: string
          example: "Empresa ABC"
        email:
          type: string
          example: "contacto@empresaabc.cl"
    Despacho:
      type: object
      properties:
        id:
          type: string
          example: "D-5001"
        cliente_id:
          type: string
          example: "C-1001"
        camion_id:
          type: string
          example: "CAM-05"
        origen:
          type: string
          example: "Concepcion"
        destino:
          type: string
          example: "Chillan"
        carga_kg:
          type: number
          example: 1500.5
        estado:
          type: string
          example: "REGISTRADO"
          
    DespachoInput:
      type: object
      required:
        - cliente_id
        - camion_id
        - origen
        - destino
        - carga_kg
      properties:
        cliente_id:
          type: string
          example: "C-1001"
        camion_id:
          type: string
          example: "CAM-05"
        origen:
          type: string
          minLength: 1
          example: "Concepcion"
        destino:
          type: string
          minLength: 1
          example: "Chillan"
        carga_kg:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: "Cantidad de carga a despachar en kilogramos, debe ser mayor que 0"
          example: 1500.5
          
    ClienteInput:
      type: object
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          minLength: 1
          example: "Empresa ABC"
        email:
          type: string
          format: email
          example: "contacto@empresaabc.cl"

    CamionDisponible:
      type: object
      properties:
        camion_id:
          type: string
          example: "CAM-04"
        origen:
          type: string
          example: "Concepcion"
        destino:
          type: string
          example: "Chillan"
        capacidad_disponible_kg:
          type: number
          example: 5000

    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "operador"
        password:
          type: string
          format: password
          example: "operador123"

    Token:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          description: Segundos hasta que el token expira.
          example: 1800

    Error:
      type: object
      properties:
        codigo:
          type: string
          example: "ERR_400"
        mensaje:
          type: string
          example: "Los datos enviados no son válidos."

  responses:
    BadRequestError:
      description: Petición mal formada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: No autenticado. Falla el token de seguridad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Autenticado, pero el rol no tiene permiso para esta operación (solo el rol operador puede modificar).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: El cuerpo o los parámetros no cumplen el contrato (tipo incorrecto, campo faltante, carga no positiva, email inválido).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  
  